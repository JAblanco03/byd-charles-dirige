<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="page-description" name="description" content="Digital business card." />
    <meta name="theme-color" content="#f1f6fc" />
    <title>Digital Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to profile</a>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" id="brand-link" href="#main">
          <span class="brand-mark" id="brand-mark" aria-hidden="true">BYD</span>
          <span id="brand-name">Business card</span>
        </a>
        <nav class="header-actions" aria-label="Card actions">
          <a class="header-link" href="#contact">Get in touch</a>
          <button class="share-button" id="share-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 13v6h14v-6" />
            </svg>
            <span>Share card</span>
          </button>
        </nav>
      </header>

      <main id="main">
        <section class="profile-card" aria-labelledby="profile-name">
          <div class="cover">
          </div>

          <div class="profile-content">
            <div class="identity">
              <div class="avatar" id="avatar">
                <img class="profile-photo" id="profile-photo" src="Images/dp.jpg" alt="Portrait of Charles David Dirige" />
                <span class="avatar-badge" aria-hidden="true">
                  <svg viewBox="0 0 20 20">
                    <path d="m5 10 3.2 3.2L15 6.5" />
                  </svg>
                </span>
              </div>
              <p class="eyebrow" id="profile-eyebrow"></p>
              <h1 id="profile-name"></h1>
              <p class="job-title" id="profile-title"></p>
              <p class="bio" id="profile-bio" hidden></p>
            </div>

            <div class="primary-actions" aria-label="Quick actions">
              <a
                class="save-button"
                id="save-contact"
                href="charles-david-dirige.vcf"
                download="Charles-David-Dirige.vcf"
              >
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13v6h14v-6" />
                </svg>
                <span>Save contact</span>
              </a>
              <a class="action-card" id="call-action">
                <span class="action-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 3a14 14 0 0 1-7-7l3-2-2-5Z" /></svg>
                </span>
                <span>Call</span>
              </a>
              <a class="action-card" id="message-action">
                <span class="action-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5 8 8 0 0 1-3.6-.9L4 20l1.4-4.2a7.4 7.4 0 0 1-.9-3.6A7.5 7.5 0 0 1 12 4.7a7.5 7.5 0 0 1 8 6.8Z" /><path d="M8 12h.01M12 12h.01M16 12h.01" /></svg>
                </span>
                <span>Text / SMS </span>
              </a>
              <a class="action-card" id="email-action">
                <span class="action-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m4 7 8 6 8-6" /></svg>
                </span>
                <span>Send Email</span>
              </a>
              <a class="action-card" id="location-action" target="_blank" rel="noreferrer">
                <span class="action-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" /><circle cx="12" cy="10" r="2.5" /></svg>
                </span>
                <span>Google Maps</span>
              </a>
            </div>

            <div class="contact-details" id="contact">
              <a id="email-detail">
                <span class="detail-icon" aria-hidden="true">@</span>
                <span id="email-text"></span>
                <span class="detail-arrow" aria-hidden="true">
                  <svg viewBox="0 0 16 16">
                    <path d="M5 11 11 5M5.5 5H11v5.5" />
                  </svg>
                </span>
              </a>
              <a id="phone-detail">
                <span class="detail-icon detail-phone" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 3a14 14 0 0 1-7-7l3-2-2-5Z" />
                  </svg>
                </span>
                <span id="phone-text"></span>
                <span class="detail-arrow" aria-hidden="true">
                  <svg viewBox="0 0 16 16">
                    <path d="M5 11 11 5M5.5 5H11v5.5" />
                  </svg>
                </span>
              </a>
            </div>

            <div class="social-section" id="social-section" hidden>
              <div class="section-heading">
                <h2>Find me around</h2>
                <span>LET’S CONNECT</span>
              </div>
              <div class="social-links" id="social-links" aria-label="Social profiles"></div>
            </div>
          </div>
          <footer class="card-footer">
            <span>Digital business card</span>
            <span>© <span id="current-year"></span></span>
          </footer>
        </section>
      </main>
      <section class="coffee-section" aria-labelledby="coffee-heading">
        <h2 id="coffee-heading" class="coffee-heading">
          <button class="coffee-toggle" id="coffee-toggle" type="button" aria-expanded="false" aria-controls="coffee-details">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z" />
              <path d="M17 10h1a3 3 0 1 1 0 6h-2M7 4v2m5-2v2" />
            </svg>
            <span>Support The Developer</span>
          </button>
        </h2>
        <div class="coffee-details" id="coffee-details" hidden>
          <p class="coffee-hint">Scan the GCash QR code to support the developer. Every little bit helps!</p>
          <img class="coffee-qr" src="Images/tip.jpg" alt="GCash QR code for sending a coffee tip" />
        </div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
